name: CI
on:
  push:
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Core tests
        run: make -C tests/host
  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: pip install esphome pytest
      - name: Config tests (examples + good / bad configs)
        run: python3 -m pytest -q tests/config
  esphome-compile:
    runs-on: ubuntu-latest
    needs: esphome-config
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: pip install esphome
      - name: Compile examples
        run: |
          cd examples
          for f in hello_world.yaml voltage_only_lipo.yaml ina226_liion.yaml; do esphome compile "$f"; done
